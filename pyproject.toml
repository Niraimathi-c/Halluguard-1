[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halluguard"
version = "0.1.0"
description = "Model-agnostic, evidence-grounded LLM reliability layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27"
]

[project.optional-dependencies]
ml = ["transformers>=4.45", "torch>=2.2", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["halluguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
